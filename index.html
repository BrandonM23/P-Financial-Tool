<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#07071a; --surface:#0f0f23; --surface2:#1a1a2e; --border:#2d2d4e;
    --text:#f1f5f9; --muted:#6b7280; --label:#9ca3af;

  html, body { max-width:100%; overflow-x:hidden; }

  .sync-bar { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .sync-hint { font-size:11px; color:var(--muted); }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; margin-top:12px; padding-bottom:8px; }
  .tab { padding:7px 11px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-size:12px; font-weight:500; white-space:nowrap; }
  .tab.active { background:var(--gold); color:#07071a; font-weight:700; border-color:var(--gold); }

  .chart-wrap { position:relative; height:230px; width:100%; max-width:100%; overflow:hidden; }

  expenses: [ {name:'Housing costs', amt:1500}, {name:'Utilities', amt:300}, {name:'Food & dining', amt:800}, {name:'Transportation', amt:300}, {name:'Misc', amt:400} ],

  retire: { monthlySpend:6000, withdrawalPct:4, returnPct:7, inflationPct:2.5, currentAge:35, currentNestEgg:100000, nestEggOverride:false, brandonSS:0, minsuSS:0, ssAge:67, brandonSSManual:false, minsuSSManual:false },

};
let S = null;
let charts = {};

/* Storage tiers: Claude artifact storage → localStorage → memory-only. Sandboxed previews can block all persistent tiers. */
let storageMode = 'memory';
const store = {
  async get(k){
    if (window.storage) { try { const r = await window.storage.get(k); storageMode='claude'; return r ? r.value : null; } catch(e){} }
    try { const v = localStorage.getItem(k); storageMode='local'; return v; } catch(e){}
    storageMode='memory'; return null;
  },
  async set(k,v){
    if (window.storage) { try { await window.storage.set(k,v); storageMode='claude'; return true; } catch(e){} }
    try { localStorage.setItem(k,v); storageMode='local'; return true; } catch(e){}
    storageMode='memory'; return false;
  }
};
async function loadState(){
  const v = await store.get('finapp-state');
  if (v) { try { S = JSON.parse(v); if(!S.portfolio)S.portfolio=DEFAULTS.portfolio; if(!S.sim)S.sim={...DEFAULTS.sim}; if(!S.oneOffExpenses)S.oneOffExpenses=[]; if(S.expenseBenchmarkPct==null)S.expenseBenchmarkPct=50; if(!S.retire.brandonSS)S.retire.brandonSS=0; if(!S.retire.minsuSS)S.retire.minsuSS=0; if(S.retire.ssAge==null)S.retire.ssAge=67; if(S.retire.brandonSSManual==null)S.retire.brandonSSManual=false; if(S.retire.minsuSSManual==null)S.retire.minsuSSManual=false; if(S.retire.nestEggOverride==null)S.retire.nestEggOverride=false; if(!S.income.taxState)S.income.taxState='NC'; if(S.income.taxCountyRate==null)S.income.taxCountyRate=0; if(S.income.brandonTrad401kPct==null)S.income.brandonTrad401kPct=0; if(S.income.minsuTrad401kPct==null)S.income.minsuTrad401kPct=0; if(S.income.taxCountyName==null)S.income.taxCountyName=''; if(S.income.additionalWithheld==null)S.income.additionalWithheld=0; if(S.income.brandonSalaryGrowthPct==null)S.income.brandonSalaryGrowthPct=S.income.salaryGrowthPct||3; if(S.income.minsuSalaryGrowthPct==null)S.income.minsuSalaryGrowthPct=S.income.salaryGrowthPct||3; S.debts.forEach(d=>{if(d.rate==null)d.rate=0; if(d.isMortgage==null)d.isMortgage=false; if(d.mortgagePrincipal==null)d.mortgagePrincipal=0; if(d.mortgageInterest==null)d.mortgageInterest=0; if(d.mortgageEscrow==null)d.mortgageEscrow=0; if(d.mortgageExtra==null)d.mortgageExtra=0;}); return; } catch(e){} }
  S = JSON.parse(JSON.stringify(DEFAULTS));
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const ok = await store.set('finapp-state', JSON.stringify(S));
    setSub(ok ? `Saved (${storageMode==='claude'?'Claude storage':'this device'}) · ` + new Date().toLocaleTimeString()
              : '⚠ Sandbox blocks storage — use Overview → Backup to export before closing');
  }, 600);
}

/* ============ TAX MODEL (2026, MFJ) ============ */
const FED_BRACKETS = [[0,0.10],[24800,0.12],[100800,0.22],[211400,0.24],[403550,0.32],[512450,0.35],[768700,0.37]];
const FED_STD = 32200;
const SS_RATE = 0.062, SS_WAGE_BASE = 184500, MED_RATE = 0.0145, ADD_MED = 0.009, ADD_MED_THRESH = 250000;

// State income tax table (2025 MFJ estimates). type: none|flat|progressive. std: MFJ standard deduction. rate/brackets per progressiveTax format.
const STATE_TAXES = {
  AK:{type:'none'}, FL:{type:'none'}, NV:{type:'none'}, SD:{type:'none'}, TN:{type:'none'}, TX:{type:'none'}, WA:{type:'none'}, WY:{type:'none'}, NH:{type:'none'},

  CO:{type:'flat',std:29200,rate:0.044},
  CT:{type:'progressive',std:0,brackets:[[0,0.03],[20000,0.05],[100000,0.055],[200000,0.06],[400000,0.065],[500000,0.069],[1000000,0.0699]]},
  DE:{type:'progressive',std:6500,brackets:[[0,0],[2000,0.022],[5000,0.039],[10000,0.048],[20000,0.052],[25000,0.0555],[60000,0.066]]},
  GA:{type:'flat',std:0,rate:0.0549},
  HI:{type:'progressive',std:8800,brackets:[[0,0.014],[4800,0.032],[9600,0.055],[19200,0.064],[28800,0.068],[38400,0.072],[48000,0.076],[72000,0.079],[96000,0.0825],[300000,0.09],[350000,0.10],[400000,0.11]]},
  ID:{type:'flat',std:29200,rate:0.058},
  IL:{type:'flat',std:0,rate:0.0495},
  IN:{type:'flat',std:0,rate:0.0315},
  IA:{type:'flat',std:29200,rate:0.057},
  KS:{type:'progressive',std:18000,brackets:[[0,0.031],[30000,0.057]]},
  KY:{type:'flat',std:6320,rate:0.04},
  LA:{type:'progressive',std:18000,brackets:[[0,0.0185],[25000,0.035],[100000,0.0425]]},
  ME:{type:'progressive',std:25900,brackets:[[0,0.058],[46000,0.0675],[109000,0.0715]]},
  MD:{type:'progressive',std:4700,brackets:[[0,0.02],[1000,0.03],[2000,0.04],[3000,0.0475],[100000,0.05],[125000,0.0525],[150000,0.055],[250000,0.0575]]},
  MA:{type:'flat',std:0,rate:0.05},
  MI:{type:'flat',std:11200,rate:0.0425},
  MN:{type:'progressive',std:27650,brackets:[[0,0.0535],[30070,0.068],[98760,0.0785],[171220,0.0985]]},
  MS:{type:'flat',std:12000,rate:0.047},
  MO:{type:'progressive',std:21900,brackets:[[0,0],[1000,0.015],[2000,0.02],[3000,0.025],[4000,0.03],[5000,0.035],[6000,0.04],[7000,0.045],[8000,0.05],[9000,0.054]]},
  MT:{type:'progressive',std:23600,brackets:[[0,0.047],[20500,0.059]]},
  NE:{type:'progressive',std:14700,brackets:[[0,0.0246],[6860,0.0351],[41190,0.0501],[66360,0.0584]]},
  NJ:{type:'progressive',std:0,brackets:[[0,0.014],[20000,0.0175],[35000,0.035],[40000,0.05526],[75000,0.0637],[500000,0.0897],[1000000,0.1075]]},
  NM:{type:'progressive',std:24850,brackets:[[0,0.017],[5500,0.032],[11000,0.047],[16000,0.049],[210000,0.059]]},
  NY:{type:'progressive',std:16050,brackets:[[0,0.04],[17150,0.045],[23600,0.0525],[27900,0.059],[215400,0.0609],[1077550,0.0685],[5000000,0.0965]]},
  NC:{type:'flat',std:25500,rate:0.0399},
  ND:{type:'progressive',std:29200,brackets:[[0,0],[44300,0.0195],[107650,0.025],[265400,0.0289]]},

  OK:{type:'progressive',std:12700,brackets:[[0,0.0025],[1000,0.0075],[2500,0.0175],[3750,0.0275],[4900,0.0375],[7200,0.0475]]},
  OR:{type:'progressive',std:24650,brackets:[[0,0.0475],[18400,0.0675],[46200,0.0875],[250000,0.099]]},

  VT:{type:'progressive',std:14600,brackets:[[0,0.0335],[45400,0.066],[110650,0.076],[231150,0.0875]]},
  VA:{type:'progressive',std:16000,brackets:[[0,0.02],[3000,0.03],[5000,0.05],[17000,0.0575]]},
  WV:{type:'progressive',std:0,brackets:[[0,0.0236],[10000,0.0315],[25000,0.0315]]},
  WI:{type:'progressive',std:23100,brackets:[[0,0.035],[13810,0.044],[27630,0.053],[304170,0.0765]]},
  DC:{type:'progressive',std:12950,brackets:[[0,0.04],[10000,0.06],[40000,0.065],[60000,0.085],[350000,0.0875],[1000000,0.1075]]},
};
function getStateTaxData(code){ return STATE_TAXES[code] || STATE_TAXES['NC']; }

const COUNTY_INCOME_RATES = {
  MD:{ _default:0.030,'Allegany':0.0305,'Anne Arundel':0.0281,'Baltimore City':0.032,'Baltimore County':0.0283,'Calvert':0.030,'Carroll':0.0305,'Cecil':0.028,'Charles':0.0303,'Frederick':0.0296,'Garrett':0.0265,'Harford':0.0306,'Howard':0.032,'Montgomery':0.032,"Prince George's":0.032,'Washington':0.028,'Wicomico':0.032,'Worcester':0.0125 },
  IN:{ _default:0.015,'Allen':0.0148,'Bartholomew':0.0175,'Delaware':0.015,'Hamilton':0.010,'Hendricks':0.010,'Johnson':0.010,'Lake':0.015,'Madison':0.0175,'Marion':0.0202,'Monroe':0.01345,'Saint Joseph':0.0175,'St. Joseph':0.0175,'Tippecanoe':0.0109,'Vanderburgh':0.012,'Vigo':0.016 },
  KY:{ _default:0.015,'Jefferson':0.0228,'Louisville':0.0228,'Fayette':0.0225,'Lexington':0.0225,'Boone':0.008,'Campbell':0.010,'Kenton':0.010,'Daviess':0.015,'Warren':0.0135 },
};
function getCountyRate(state, county){
  const st = COUNTY_INCOME_RATES[state];
  if (!st) return 0;
  const c = (county||'').trim();
  if (!c) return st._default||0;
  const key = Object.keys(st).find(k => k!=='_default' && k.toLowerCase()===c.toLowerCase());
  if (key) return st[key];
  const part = Object.keys(st).find(k => k!=='_default' && c.toLowerCase().includes(k.toLowerCase()));
  return part ? st[part] : (st._default||0);
}

function progressiveTax(taxable, brackets){
  if (taxable <= 0) return 0;
  let tax = 0;
  for (let i=0;i<brackets.length;i++){
    const [lo, rate] = brackets[i];
    const hi = i+1 < brackets.length ? brackets[i+1][0] : Infinity;
    if (taxable > lo) tax += (Math.min(taxable, hi) - lo) * rate;
  }
  return tax;
}
function calcHousehold(inc){
  const bG = inc.brandonGross, mG = inc.minsuGross;
  const mNonTax  = mG * Math.min(100, Math.max(0, inc.minsuNonTaxPct||0))/100;
  const bTrad    = bG * Math.min(100, Math.max(0, inc.brandonTrad401kPct||0))/100;
  const mTrad    = mG * Math.min(100, Math.max(0, inc.minsuTrad401kPct||0))/100;
  const incomeTaxableWages = Math.max(0, bG + (mG - mNonTax) - bTrad - mTrad);
  const fedTax = progressiveTax(incomeTaxableWages - FED_STD, FED_BRACKETS);
  // State tax — dynamic from S.income
  const sd = getStateTaxData(inc.taxState||'NC');
  const stateTaxable = Math.max(0, incomeTaxableWages - (sd.std||0));
  const stateTax = sd.type==='none' ? 0
    : sd.type==='flat' ? stateTaxable * sd.rate
    : progressiveTax(stateTaxable, sd.brackets);
  const countyTax = incomeTaxableWages * getCountyRate(inc.taxState||'NC', inc.taxCountyName||'');
  const fica = Math.min(bG, SS_WAGE_BASE)*SS_RATE + bG*MED_RATE
             + Math.min(mG, SS_WAGE_BASE)*SS_RATE + mG*MED_RATE
             + Math.max(0, bG+mG-ADD_MED_THRESH)*ADD_MED;
  const roth = bG*inc.brandonRoth401kPct/100 + mG*inc.minsuRoth401kPct/100;
  const trad = bTrad + mTrad;
  const additionalWithheld = inc.additionalWithheld || 0;
  const netAnnual = bG + mG - fedTax - stateTax - countyTax - fica - roth - trad;
  // additionalWithheld is a timing difference (refunded at year end), not deducted from netAnnual
  return { gross:bG+mG, fedTax, stateTax, countyTax, fica, roth, trad, additionalWithheld, netAnnual, netMonthly:netAnnual/12, rothMonthly:roth/12, taxableWages:incomeTaxableWages };
}

/* ============ CALC HELPERS ============ */
const fmt = n => '$' + (Math.round(n)||0).toLocaleString();
const fmtK = n => Math.abs(n)>=1e6 ? '$'+(n/1e6).toFixed(2)+'M' : '$'+Math.round(n/1000)+'k';
function monthKey(d){ return d.toISOString().slice(0,7); }
function mortgagePI(d){ return (d.mortgagePrincipal||0)+(d.mortgageInterest||0)+(d.mortgageExtra||0); }
function activeDebtPayment(debt, ym){
  if (debt.end && ym > debt.end) return 0;
  return debt.isMortgage
    ? (debt.mortgagePrincipal||0)+(debt.mortgageInterest||0)+(debt.mortgageEscrow||0)+(debt.mortgageExtra||0)
    : Number(debt.payment||0);
}
function nowYM(){ return monthKey(new Date()); }

function monthlyPicture(ym){
  const t = calcHousehold(S.income);
  const exp = S.expenses.reduce((a,e)=>a+Number(e.amt||0),0);
  const debtPay = S.debts.reduce((a,d)=>a+activeDebtPayment(d, ym),0);
  const outflow = exp + debtPay;
  const surplus = t.netMonthly - outflow;
  return { tax:t, exp, debtPay, outflow, surplus, savingsRate: t.netMonthly>0 ? (surplus + t.rothMonthly)/(t.netMonthly + t.rothMonthly) : 0 };
}
function annualPicture(){
  const now = new Date(); let exp=0, debt=0;
  for (let m=0;m<12;m++){
    const ym = monthKey(new Date(now.getFullYear(), m, 15));
    exp += S.expenses.reduce((a,e)=>a+Number(e.amt||0),0);
    debt += S.debts.reduce((a,d)=>a+activeDebtPayment(d, ym),0);
  }
  const t = calcHousehold(S.income);
  const surplus = t.netAnnual - (exp+debt);
  const savingsRate = t.netAnnual>0 ? (surplus + t.roth) / (t.netAnnual + t.roth) : 0;
  return { tax:t, exp, debtPay:debt, outflow:exp+debt, surplus, savingsRate };
}

/* ============ CLOUD SYNC (private GitHub repo, Contents API) ============ */
let syncCfg = { token:'', repo:'', path:'finances-data.json', autoPull:false };
async function loadSync(){
  const v = await store.get('finapp-sync');
  if (v){ try{ const c = JSON.parse(v); syncCfg = { token:c.token||'', repo:c.repo||'', path:c.path||'finances-data.json', autoPull:!!c.autoPull }; }catch(e){} }
}
async function saveSyncCfg(){ await store.set('finapp-sync', JSON.stringify(syncCfg)); }
function ghHeaders(){ return {'Authorization':'Bearer '+syncCfg.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}; }
function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(s.replace(/\s/g,'')))); }
function contentsUrl(){ return 'https://api.github.com/repos/'+syncCfg.repo+'/contents/'+syncCfg.path; }
async function repoFetch(){ // → {sha, data} | {sha:null} if file absent | throws
  const r = await fetch(contentsUrl(), {headers:ghHeaders()});
  if (r.status === 404) return { sha:null };
  const d = await r.json();
  if (!r.ok) throw new Error(d.message||('HTTP '+r.status));
  return { sha:d.sha, data: JSON.parse(b64d(d.content)) };
}
async function repoPush(){
  if (!syncCfg.token || !syncCfg.repo) return setSub('Sync: token + repo (owner/name) required');
  try {
    const cur = await repoFetch(); // need current sha to update
    const body = { message:'sync '+new Date().toISOString(), content:b64e(JSON.stringify(S)) };
    if (cur.sha) body.sha = cur.sha;
    const r = await fetch(contentsUrl(), {method:'PUT', headers:ghHeaders(), body:JSON.stringify(body)});
    const d = await r.json();
    if (!r.ok) return setSub('Sync push failed: '+(d.message||r.status));
    setSub('☁ Pushed · '+new Date().toLocaleTimeString());
  } catch(e){ setSub('Sync push failed: '+e.message); }
}
async function repoPull(){
  if (!syncCfg.token || !syncCfg.repo) return setSub('Sync: token + repo (owner/name) required');
  try {
    const cur = await repoFetch();
    if (!cur.sha) return setSub('Sync: no data in repo yet — Push from the master device first');
    S = cur.data;
    if (!S.portfolio) S.portfolio = []; if (!S.sim) S.sim = {...DEFAULTS.sim};
    save(); renderContent();
    setSub('☁ Pulled · '+new Date().toLocaleTimeString());
  } catch(e){ setSub('Sync pull failed: '+e.message); }
}

/* ============ OVERVIEW ============ */
let overviewDrill = null;
function overviewDrillData(segment, p, t, isAnnual){
  const txScale = isAnnual ? 1 : 12;  // t.X is always annual; divide by txScale for display period
  const moMult  = isAnnual ? 12 : 1;  // monthly amounts; multiply by moMult for display period
  // Default: full allocation (shown when nothing or Discretionary is selected)
  if (!segment || segment==='Discretionary') {
    const taxes = (t.fedTax+t.stateTax+t.countyTax+t.fica + (isAnnual ? 0 : t.additionalWithheld)) / txScale;
    const roth  = t.roth / txScale;
    const debt  = p.debtPay;
    const exp   = p.exp;
    const disc  = Math.max(0, t.gross/txScale - taxes - roth - debt - exp);
    const k401 = (t.roth + t.trad) / txScale;
    return {
      title:'Allocation',
      labels:['Taxes','401k','Debt Pmts','Expenses','Discretionary'],
      data:[taxes, k401, debt, exp, disc].map(Math.round),
      colors:['#ef4444','#8b5cf6','#f97316','#f59e0b','#10b981']
    };
  }
  if (segment==='Gross Income') {
    return {
      title:'Income Sources',
      labels:['Brandon','Minsu'],
      data:[Math.round(S.income.brandonGross/txScale), Math.round(S.income.minsuGross/txScale)],
      colors:['#e8c547','#f0a500']
    };
  }
  if (segment==='Taxes') {
    const taxItems = [
      {l:'Federal',    v:t.fedTax,              c:'#ef4444'},
      {l:'State',      v:t.stateTax,            c:'#f97316'},
      {l:'County',     v:t.countyTax,           c:'#eab308'},
      {l:'FICA',       v:t.fica,                c:'#ec4899'},
      {l:'Additional', v: isAnnual ? 0 : t.additionalWithheld, c:'#6366f1'}
    ].filter(x=>x.v>0);
    return { labels:taxItems.map(x=>x.l), data:taxItems.map(x=>Math.round(x.v/txScale)), colors:taxItems.map(x=>x.c) };
  }
  if (segment==='401k') {
    const bTrad = S.income.brandonGross*(S.income.brandonTrad401kPct||0)/100/txScale;
    const mTrad = S.income.minsuGross*(S.income.minsuTrad401kPct||0)/100/txScale;
    const bRoth = S.income.brandonGross*S.income.brandonRoth401kPct/100/txScale;
    const mRoth = S.income.minsuGross*S.income.minsuRoth401kPct/100/txScale;
    return {
      title:'401k Breakdown',
      labels:['Brandon Trad','Brandon Roth','Minsu Trad','Minsu Roth'].filter((_,i)=>[bTrad,bRoth,mTrad,mRoth][i]>0),
      data:[bTrad,bRoth,mTrad,mRoth].filter(v=>v>0).map(Math.round),
      colors:['#7c3aed','#8b5cf6','#db2777','#ec4899'].filter((_,i)=>[bTrad,bRoth,mTrad,mRoth][i]>0)
    };
  }
  if (segment==='Debt Pmts'){
    const ym = nowYM();
    const items = S.debts.map(d=>({name:d.name,val:activeDebtPayment(d,ym)*moMult})).filter(d=>d.val>0);
    return { labels:items.map(d=>d.name), data:items.map(d=>d.val), colors:['#f97316','#ef4444','#f59e0b','#10b981','#3b82f6','#a855f7'] };
  }
  if (segment==='Expenses'){
    const sorted = [...S.expenses].filter(e=>Number(e.amt)>0).sort((a,b)=>b.amt-a.amt);
    const top = sorted.slice(0,6), rest = sorted.slice(6);
    const labels = top.map(e=>e.name), data = top.map(e=>Number(e.amt)*moMult);
    if (rest.length) { labels.push('Other'); data.push(rest.reduce((s,e)=>s+Number(e.amt)*moMult,0)); }
    return { labels, data, colors:['#3b82f6','#ef4444','#22c55e','#f59e0b','#a855f7','#ec4899','#14b8a6'] };
  }
  return null;
}

    if (charts.expPie) { charts.expPie.destroy(); delete charts.expPie; }
    const pieItems = S.expenses.filter(e=>Number(e.amt||0)>0);
    const pieTotal = pieItems.reduce((a,e)=>a+Number(e.amt),0);
    const palette = ['#6a9fb5','#e07b54','#7dc98f','#d4a843','#b07db5','#e07b7b','#5fa88f','#a8865f'];
    const segmentLabels = {
      id:'segmentLabels',
      afterDatasetsDraw(chart){
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        const total = chart.data.datasets[0].data.reduce((a,b)=>a+b,0);
        meta.data.forEach((arc, i) => {
          const span = arc.endAngle - arc.startAngle;
          if (span < 0.35) return; // skip slivers — no room for text
          const mid = (arc.startAngle + arc.endAngle) / 2;
          const r = (arc.innerRadius + arc.outerRadius) / 2;
          const x = arc.x + Math.cos(mid) * r;
          const y = arc.y + Math.sin(mid) * r;
          const val = chart.data.datasets[0].data[i];
          const pct = total > 0 ? (val/total*100).toFixed(0) : 0;
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(pct+'%', x, y-7);
          ctx.font = '10px sans-serif';
          ctx.fillText(fmt(val), x, y+7);
          ctx.restore();
        });
      }
    };
    charts.expPie = new Chart(pieCtx, {
      type:'doughnut',
      plugins:[segmentLabels],
      data:{
        labels: pieItems.map(e=>e.name),
        datasets:[{ data: pieItems.map(e=>Number(e.amt)), backgroundColor: palette.slice(0,pieItems.length), borderWidth:2 }]

            const pct = pieTotal>0 ? (val/pieTotal*100).toFixed(1) : 0;
            return ` ${c.label}: ${fmt(val)} (${pct}%)`;
          }}}
        }
      }
    });
  }
}};

const DEBT_COLORS = ['#ef4444','#f97316','#eab308','#8b5cf6','#3b82f6','#10b981','#ec4899','#06b6d4'];
const vDebt = {
html(){
  const ym = nowYM();
  const totBal = S.debts.reduce((a,d)=>a+Number(d.balance||0),0);
  const totPay = S.debts.reduce((a,d)=>a+activeDebtPayment(d,ym),0);

  // lifetime cost per active debt
  const active = S.debts.filter(d=>!d.end||d.end>=ym);
  const debtRows = active.map((d,i)=>{
    const bal = Number(d.balance||0), rate = Number(d.rate||0);
    const pmt = d.isMortgage ? mortgagePI(d) : Number(d.payment||0);
    const color = DEBT_COLORS[i % DEBT_COLORS.length];
    if (!d.end) return {name:d.name, bal, interest:0, total:bal, hasEnd:false, color, rate, isMortgage:d.isMortgage};
    const [ey,em]=d.end.split('-').map(Number), [ny,nm]=ym.split('-').map(Number);
    const months = Math.max(0,(ey-ny)*12+(em-nm));
    let interest;
    if (rate > 0) {
      const mr = rate / 100 / 12;
      let b = bal, totalInt = 0;
      for (let m = 0; m < months; m++) {
        const intChg = b * mr; totalInt += intChg;
        b = Math.max(0, b + intChg - pmt);
        if (b <= 0) break;
      }
      interest = Math.round(totalInt);
    } else {
      interest = Math.max(0, pmt * months - bal);
    }
    return {name:d.name, bal, interest, total:bal+interest, months, hasEnd:true, color, rate, isMortgage:d.isMortgage};

      <div style="flex:1;min-width:0">
        ${debtRows.length ? debtRows.map(r=>`
          <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">

            <div style="flex:1;min-width:0;overflow:hidden">

      <div class="row" style="border:none;padding:3px 0"><span class="nm">Interest rate (%)</span><input type="number" value="${d.rate||0}" min="0" max="30" step="0.1" onfocus="this.select()" onchange="S.debts[${i}].rate=Number(this.value);save();renderContent()"></div>
      ${d.isMortgage ? `
      <div class="row" style="border:none;padding:3px 0"><span class="nm">Current principal</span><input type="number" value="${d.mortgagePrincipal||0}" onfocus="this.select()" onchange="S.debts[${i}].mortgagePrincipal=Number(this.value);save();renderContent()"></div>

    </div>`).join('')}
  <div style="margin-top:10px"><button class="btn ghost sm" onclick="S.debts.push({name:'New debt',balance:0,rate:0,payment:0,end:'',isMortgage:false,mortgagePrincipal:0,mortgageInterest:0,mortgageEscrow:0,mortgageExtra:0});save();renderContent()">+ Add debt</button></div>

after(){

    if (d.end) {
      const [ey,em]=d.end.split('-').map(Number), [ny,nm]=ym.split('-').map(Number);

const NEST_EGG_INCLUDE = /retirement|401k|403b|ira|brokerage|investment/i;
const NEST_EGG_CASH    = /cash|savings|checking/i;
const NEST_EGG_EXCLUDE = /home|house|property/i;
function nestEggComponents(){
  const investItems = S.assets.filter(a => NEST_EGG_INCLUDE.test(a.name) && !NEST_EGG_EXCLUDE.test(a.name));
  const cashItems   = S.assets.filter(a => NEST_EGG_CASH.test(a.name)    && !NEST_EGG_EXCLUDE.test(a.name));
  const cashTotal   = cashItems.reduce((s,a)=>s+Number(a.amt||0),0);
  const goalsEarmarked = S.goals.reduce((s,g)=>s+Number(g.saved||0),0);
  const excessCash  = Math.max(0, cashTotal - goalsEarmarked);
  return { investItems, portVal: portfolioTotal(), cashItems, cashTotal, goalsEarmarked, excessCash };
}
function nestEggValue(){
  if (S.retire.nestEggOverride) return Number(S.retire.currentNestEgg||0);
  const { investItems, portVal, excessCash } = nestEggComponents();
  return investItems.reduce((s,a)=>s+Number(a.amt||0),0) + portVal + excessCash;
}
function calcSS(grossAnnual, claimAge){
  // Estimate AIME assuming current salary reflects career average (35-yr history)
  const aime = grossAnnual / 12;
  // 2026 PIA bend points
  const bp1 = 1226, bp2 = 7391;
  let pia = aime <= bp1
    ? aime * 0.90
    : aime <= bp2
      ? bp1 * 0.90 + (aime - bp1) * 0.32
      : bp1 * 0.90 + (bp2 - bp1) * 0.32 + (aime - bp2) * 0.15;
  // Claiming age adjustment vs FRA 67 (born 1960+)
  const fra = 67, years = claimAge - fra;
  const factor = years >= 0
    ? 1 + years * 0.08
    : years >= -3 ? 1 + years * 0.0667 : 1 - 3*0.0667 + (years+3)*0.05;
  return Math.round(pia * factor);
}
function retireCalc(monthlyContrib, retn, targetOverride){
  const r = S.retire;
  const target = targetOverride !== undefined ? targetOverride : (r.monthlySpend*12) / (r.withdrawalPct/100);
  const mRate = retn/100/12;
  let bal = nestEggValue(), months = 0;
  while (bal < target && months < 12*60){ bal = bal*(1+mRate) + monthlyContrib; months++; }
  return { target, months, years: months/12, ageAt: r.currentAge + months/12 };
}

/* ============ SIMULATION (Monte Carlo) ============ */
function randn(){ let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function runMonteCarlo(){
  const c = S.sim, r = S.retire;
  const p = monthlyPicture(nowYM());
  const contrib = (Math.max(0,p.surplus)*c.investPctOfSurplus/100) + p.tax.rothMonthly;
  const start = nestEggValue();
  const target = (r.monthlySpend*12)/(r.withdrawalPct/100);
  const muM = c.meanPct/100/12, sigM = c.volPct/100/Math.sqrt(12);
  const years = c.years, runs = Math.min(5000, Math.max(100, c.runs));
  const yearly = Array.from({length:years+1},()=>[]);
  let hit = 0;
  for (let k=0;k<runs;k++){
    let bal = start; yearly[0].push(bal); let reached=false;
    for (let y=1;y<=years;y++){
      for (let m=0;m<12;m++){ bal = bal*(1+muM+sigM*randn()) + contrib; }
      yearly[y].push(bal); if (bal>=target) reached=true;
    }
    if (reached) hit++;
  }
  const pct = (arr,q)=>{ const s=[...arr].sort((a,b)=>a-b); return s[Math.floor(q*(s.length-1))]; };
  return { target, contrib, start, successPct: hit/runs*100,
    p10: yearly.map(a=>pct(a,0.10)), p50: yearly.map(a=>pct(a,0.50)), p90: yearly.map(a=>pct(a,0.90)),
    endMedian: pct(yearly[years],0.5) };
}

    for (let m=0;m<12;m++){

/* ============ AI STRATEGY ============ */
function buildSnapshot(){
  const p = monthlyPicture(nowYM());
  const a = annualPicture();
  const assets = S.assets.reduce((x,y)=>x+Number(y.amt||0),0);
  const debt = S.debts.reduce((x,y)=>x+Number(y.balance||0),0);
  return {
    date: new Date().toISOString().slice(0,10),
    household: 'Brandon & Minsu, MFJ, North Carolina',
    income: { brandonGross:S.income.brandonGross, minsuGross:S.income.minsuGross, minsuNonTaxablePct:S.income.minsuNonTaxPct,
      roth401k:{brandonPct:S.income.brandonRoth401kPct, minsuPct:S.income.minsuRoth401kPct, type:'post-tax Roth'},
      netMonthly: Math.round(p.tax.netMonthly) },
    monthly: { expenses:Math.round(p.exp), debtPayments:Math.round(p.debtPay), surplus:Math.round(p.surplus), savingsRatePct:(p.savingsRate*100).toFixed(1) },
    annualSurplus: Math.round(a.surplus),
    debts: S.debts.map(d=>({name:d.name, balance:d.balance, payment:d.payment, endDate:d.end||'ongoing'})),
    assets: S.assets, netWorth: assets-debt,
    retirement: { ...S.retire, currentNestEgg: nestEggValue(), targetNestEgg: Math.round((S.retire.monthlySpend*12)/(S.retire.withdrawalPct/100)) },
    goals: S.goals,
    portfolio: { totalValue: Math.round(portfolioTotal()), holdings: S.portfolio },
    lastSimulation: lastSim ? { successPct:+lastSim.successPct.toFixed(0), medianEnd:Math.round(lastSim.endMedian), target:Math.round(lastSim.target), assumptions:S.sim } : 'not run',
    notes: 'Student loans ~5.6% APR. Car loan ends Sept 2026. Daycare will eventually end (not modeled).'
  };
}
let aiBusy = false, apiKey = '';
async function saveKey(v){ apiKey = v.trim(); await store.set('finapp-apikey', apiKey); renderContent(); }
async function askAI(prompt){
  if (aiBusy || !prompt.trim()) return;
  aiBusy = true;
  S.chat.push({role:'user', content:prompt});
  renderChat(true);
  try {
    const apiMessages = S.chat.map((m,i)=>{
      if (m.role==='user' && i===S.chat.length-1){
        return { role:'user', content:
`You are the AI strategist inside Brandon's household financial planning app. Current live financial snapshot:
${JSON.stringify(buildSnapshot(), null, 1)}

Style rules: brutally direct, quantitative, terse. No pandering, no "on the other hand" deflection. Give a clear recommendation with the reasoning and the key risk. Use the actual numbers from the snapshot. If a question requires data you don't have (e.g., risk tolerance, fund options in his 401k), say exactly what's missing. You are providing educational strategy analysis, not licensed financial advice — do not repeat a disclaimer every message; the app displays one.

Brandon's question: ${m.content}` };
      }
      return { role:m.role==='ai'?'assistant':'user', content:m.content };
    });
    const headers = {'Content-Type':'application/json'};
    if (apiKey){
      headers['x-api-key'] = apiKey;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
    }
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers,
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1500, messages:apiMessages,
        tools:[{type:'web_search_20250305', name:'web_search'}] })
    });
    const data = await resp.json();
    if (!resp.ok || data.error){
      S.chat.push({role:'ai', content:'API error '+resp.status+': '+(data.error&&data.error.message||JSON.stringify(data).slice(0,300))});
    } else {
      const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
      S.chat.push({role:'ai', content: text || 'Empty response. Try again.'});
    }
  } catch(e){
    S.chat.push({role:'ai', content:'Request failed: '+e.message+(apiKey?'\n\nKey is set but the call still failed \u2014 check the key is valid and has credit at console.anthropic.com.':'\n\nThis copy is running outside Claude, so it needs your own Anthropic API key. Paste one in the API key field above (get one at console.anthropic.com \u2192 API Keys). It stores on this device only \u2014 never in the file.')});
  }
  aiBusy = false; save(); renderChat(false);
}
function renderChat(busy){
  const box = document.getElementById('chatBox');
  if (!box) return;
  box.innerHTML = S.chat.map(m=>`<div class="msg ${m.role}">${m.content.replace(/</g,'&lt;')}</div>`).join('')
    + (busy?'<div class="msg ai"><span class="spin"></span> Analyzing your numbers…</div>':'');
  box.scrollTop = box.scrollHeight;
}
